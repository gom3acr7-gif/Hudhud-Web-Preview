
name: Deploy Hudhud Web Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Hudhud project
        run: |
          mkdir -p source
          unzip -q Hudhud-source-web.zip -d source

      - name: Find project files
        run: |
          find source -maxdepth 4 -name package.json -print

      - name: Install dependencies
        run: |
          PACKAGE_DIR=$(dirname "$(find source -name package.json -print -quit)")
          echo "Project directory: $PACKAGE_DIR"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          cd "$PACKAGE_DIR"
          npm install

      - name: Build website
        run: |
          cd "$PACKAGE_DIR"
          npm run build
          echo "BUILD_DIR=$PACKAGE_DIR/dist" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
