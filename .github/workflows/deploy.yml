
name: Deploy Hudhud Web Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Hudhud project
        run: |
          mkdir -p source
          unzip -q Hudhud-source-web.zip -d source

      - name: Locate project
        shell: bash
        run: |
          PACKAGE_FILE=$(find source -name package.json -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build website
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm run build

          if [ ! -d dist ]; then
            echo "ERROR: Build completed but dist folder was not found."
            exit 1
          fi

          echo "BUILD_DIR=$PROJECT_DIR/dist" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
